name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      # in-flight cross-dep: spec-tools fallback_handlers (PR #45) not yet published
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-spec-tools@fix/session-fallback-handlers'
      test_path: 'test/unittests'
